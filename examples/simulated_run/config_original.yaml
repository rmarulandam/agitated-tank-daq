# SIMULATION ONLY. Hardware backend refuses this configuration.
schema_version: 1
simulation_only: true
run:
  label: SIMULATION
  operator: ''
  notes: Synthetic demonstration only. These ranges are NOT specifications of the
    delivered sensors.
hardware:
  chassis: cDAQ1
  rtd_module: cDAQ1Mod1
  analog_module: cDAQ1Mod2
  counter_module: cDAQ1Mod3
checks:
  wiring_verified: false
  sensor_supplies_verified: false
  rtd_curve_verified: false
  hall_logic_verified: false
sampling:
  rtd_hz: 1.0
  analog_hz: 10.0
  counter_poll_hz: 2.0
  flow_window_s: 10.0
  buffer_seconds: 60.0
  idle_timeout_s: 10.0
  max_block_samples: 100
  queue_blocks: 256
rtd:
  type: PT_3851
  curve_note: 'NI standard curve selection; verify against TL4050 PT100 certificate
    before enabling hardware. Quotation alpha: 0.003850.'
  r0_ohm: 100.0
  excitation_a: 0.001
  adc_mode: HIGH_RESOLUTION
  measurement_range_c:
  - -20.0
  - 100.0
  channels:
  - name: t_water_in_c
    physical: cDAQ1Mod1/ai0
    gain: 1.0
    offset_c: 0.0
    calibration_id: none_individual_probe_correction_not_applied
  - name: t_water_out_c
    physical: cDAQ1Mod1/ai1
    gain: 1.0
    offset_c: 0.0
    calibration_id: none_individual_probe_correction_not_applied
  - name: t_water_level_quarter_c
    physical: cDAQ1Mod1/ai2
    gain: 1.0
    offset_c: 0.0
    calibration_id: none_individual_probe_correction_not_applied
  - name: t_water_level_three_quarters_c
    physical: cDAQ1Mod1/ai3
    gain: 1.0
    offset_c: 0.0
    calibration_id: none_individual_probe_correction_not_applied
analog:
  terminal_configuration: DIFFERENTIAL
  channels:
  - name: t_air_in_c
    unit: degC
    physical: cDAQ1Mod2/ai0
    negative_input: ai8
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Inlet air temperature transmitter (4-20 mA over shunt R1); verify
      range endpoints.
    scale:
      kind: current_loop
      confirmed: true
      engineering_range:
      - -20.0
      - 80.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      shunt_id: R1
      shunt_ohm: 250.0
      signal_range_ma:
      - 4.0
      - 20.0
  - name: t_air_out_c
    unit: degC
    physical: cDAQ1Mod2/ai1
    negative_input: ai9
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Outlet air temperature transmitter (4-20 mA over shunt R2); verify
      range endpoints.
    scale:
      kind: current_loop
      confirmed: true
      engineering_range:
      - -20.0
      - 80.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      shunt_id: R2
      shunt_ohm: 250.0
      signal_range_ma:
      - 4.0
      - 20.0
  - name: p_atm_pa
    unit: Pa
    physical: cDAQ1Mod2/ai2
    negative_input: ai10
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Quoted available analog/RS485 variants; confirm actual 4-20 mA absolute-pressure
      variant.
    scale:
      kind: current_loop
      confirmed: true
      engineering_range:
      - 0.0
      - 120000.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      shunt_id: R3
      shunt_ohm: 250.0
      signal_range_ma:
      - 4.0
      - 20.0
  - name: rh_ambient_pct
    unit: percent_RH
    physical: cDAQ1Mod2/ai3
    negative_input: ai11
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Quotation says 0-99.9% RH; verify transmitter scaling endpoints.
    scale:
      kind: current_loop
      confirmed: true
      engineering_range:
      - 0.0
      - 100.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      shunt_id: R4
      shunt_ohm: 250.0
      signal_range_ma:
      - 4.0
      - 20.0
  - name: dp_air_duct_pa
    unit: Pa
    physical: cDAQ1Mod2/ai4
    negative_input: ai12
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Air differential pressure transmitter (4-20 mA over shunt R5); verify
      range endpoints.
    scale:
      kind: current_loop
      confirmed: true
      engineering_range:
      - 0.0
      - 3000.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      shunt_id: R5
      shunt_ohm: 250.0
      signal_range_ma:
      - 4.0
      - 20.0
  - name: level_water_m
    unit: m
    physical: cDAQ1Mod2/ai5
    negative_input: ai13
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Tank water level transmitter (0-10 V linear); verify range endpoints.
    scale:
      kind: voltage_linear
      confirmed: true
      engineering_range:
      - 0.0
      - 2.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      signal_range_v:
      - 0.0
      - 10.0
  - name: power_motor_w
    unit: W
    physical: cDAQ1Mod2/ai6
    negative_input: ai14
    daq_range_v:
    - -10.0
    - 10.0
    source_note: Motor electrical power transmitter (0-10 V linear); verify range
      endpoints.
    scale:
      kind: voltage_linear
      confirmed: true
      engineering_range:
      - 0.0
      - 1500.0
      post_gain: 1.0
      post_offset: 0.0
      calibration_id: SYNTHETIC_EXAMPLE_ONLY
      signal_range_v:
      - 0.0
      - 10.0
counter:
  bits: 32
  edge: RISING
  channels:
  - name: water_flow_in
    unit: L/min
    physical: cDAQ1Mod3/ctr0
    pulse_terminal: /cDAQ1Mod3/PFI0
    hz_per_unit: 0.5
    calibration_confirmed: true
    calibration_id: SYNTHETIC_EXAMPLE_ONLY
    valid_range:
    - 5.0
    - 150.0
    nominal_source: 'DSC-742-R3 p2: F=0.5*Q; Q in L/min. Verify delivered inlet sensor
      and calibration.'
  - name: water_flow_out
    unit: L/min
    physical: cDAQ1Mod3/ctr1
    pulse_terminal: /cDAQ1Mod3/PFI1
    hz_per_unit: 0.5
    calibration_confirmed: true
    calibration_id: SYNTHETIC_EXAMPLE_ONLY
    valid_range:
    - 5.0
    - 150.0
    nominal_source: 'DSC-742-R3 p2: F=0.5*Q; Q in L/min. Verify delivered outlet sensor
      and calibration.'
  - name: impeller_rpm
    unit: rpm
    physical: cDAQ1Mod3/ctr2
    pulse_terminal: /cDAQ1Mod3/PFI2
    hz_per_unit: 1.0
    calibration_confirmed: true
    calibration_id: SYNTHETIC_EXAMPLE_ONLY
    valid_range:
    - 10.0
    - 600.0
    nominal_source: 'hz_per_unit = pulses_per_rev / 60.0 (1.0 Hz/RPM for 60 pulses/rev).
      Verify shaft sensor pulses per revolution.'
storage:
  tdms: false
  min_free_mb: 500.0
  commit_interval_s: 1.0
external:
  impeller_rpm: null
  method: ''
  uncertainty_rpm: null
  source: external_calculation_not_cDAQ
